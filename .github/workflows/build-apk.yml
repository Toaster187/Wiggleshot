name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Upload release APK (fast, use this one on the phone)
        uses: actions/upload-artifact@v4
        with:
          name: wiggleshot-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wiggleshot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
